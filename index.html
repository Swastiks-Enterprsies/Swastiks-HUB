<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Swastiks Enterprises</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a73e8" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f4f2;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  header {
    flex: 0 0 auto;
    background: #1a73e8;
    color: #fff;
    padding: 12px 8px 12px 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    z-index: 3;
    position: relative;
  }
  header .menu-btn {
    border: none;
    background: none;
    color: #fff;
    padding: 8px;
    display: flex;
    align-items: center;
    cursor: pointer;
    border-radius: 6px;
  }
  header .menu-btn:active { background: rgba(255,255,255,0.15); }
  header .menu-btn svg { width: 22px; height: 22px; }
  header .title { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  header .clock {
    margin-left: auto;
    text-align: right;
    line-height: 1.3;
    flex: none;
    max-width: 92px;
  }
  header .clock .clock-day {
    font-size: 9.5px;
    font-weight: 600;
    opacity: 0.9;
    display: block;
  }
  header .clock .clock-time {
    font-size: 10.5px;
    opacity: 0.85;
    display: block;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 4;
    display: none;
  }
  .menu-overlay.open { display: block; }

  .menu-panel {
    position: absolute;
    top: 0; left: 0;
    width: 240px;
    max-width: 78vw;
    height: 100%;
    background: #fff;
    box-shadow: 2px 0 10px rgba(0,0,0,0.15);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
  }
  .menu-overlay.open .menu-panel { transform: translateX(0); }

  .menu-header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid #eee;
  }
  .menu-header .brand { font-size: 15px; font-weight: 600; color: #222; }
  .menu-header .sub { font-size: 12px; color: #888; margin-top: 2px; }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-size: 14px;
    color: #444;
    cursor: pointer;
    font-family: inherit;
  }
  .menu-item svg { width: 20px; height: 20px; flex: none; stroke: #888; }
  .menu-item.active { background: #eef4fd; color: #1a73e8; font-weight: 600; }
  .menu-item.active svg { stroke: #1a73e8; }

  .menu-parent {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    color: #333;
    cursor: pointer;
    font-family: inherit;
  }
  .menu-parent svg.icon { width: 20px; height: 20px; flex: none; stroke: #888; }
  .menu-parent .chevron { width: 16px; height: 16px; margin-left: auto; stroke: #999; transition: transform 0.18s ease; }
  .menu-parent.open .chevron { transform: rotate(90deg); }

  .submenu {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
    background: #fafafa;
  }
  .submenu.open { max-height: 200px; }

  .submenu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 12px 44px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    font-family: inherit;
  }
  .submenu-item.active { color: #1a73e8; font-weight: 600; background: #eef4fd; }
  .submenu-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #bbb; flex: none; }
  .submenu-item.active .dot { background: #1a73e8; }

  .screens {
    flex: 1 1 auto;
    position: relative;
    background: #fff;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: none;
  }
  .screen.active { display: block; }
  .screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .home-hero {
    width: 100%;
    display: block;
    background: #fff;
  }
  .home-content {
    height: 100%;
    overflow-y: auto;
    padding: 0 0 24px;
  }
  .home-banner-wrap {
    width: 100%;
    background: #fff;
    padding: 28px 20px 20px;
    display: flex;
    justify-content: center;
    border-bottom: 1px solid #f0f0ee;
  }
  .home-banner {
    max-width: 280px;
    width: 100%;
    height: auto;
    display: block;
  }

  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: #888;
    font-size: 13px;
    background: #fff;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #e0e0e0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 700px) {
    .home-banner-wrap { padding: 18px 20px 12px; }
    .home-banner { max-width: 200px; }
    .home-hero {
      width: auto;
      max-width: 420px;
      max-height: 32vh;
      object-fit: contain;
      margin: 0 auto;
      display: block;
    }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <button class="menu-btn" id="menu-toggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="title">SWASTIKS ENTERPRISES</span>
    <span class="clock">
      <span class="clock-day" id="clock-day">--</span>
      <span class="clock-time" id="clock-time">--:--</span>
    </span>
  </header>

  <div class="menu-overlay" id="menu-overlay">
    <div class="menu-panel">
      <div class="menu-header">
        <div class="brand">Swastiks enterprises</div>
        <div class="sub">Select a report</div>
      </div>

      <button class="menu-item active" data-screen="home" data-title="Swastiks Enterprises">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>

          <path d="M21 8L12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>
        </svg>
        Stock Report
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div class="submenu" data-submenu="stock">
        <button class="submenu-item" data-screen="stock" data-title="Stock Report - CBE (Coimbatore)">
          <span class="dot"></span>CBE (Coimbatore)
        </button>
      </div>

      <button class="menu-parent" data-parent="sales">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
        </svg>
        Sales
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div class="submenu" data-submenu="sales">
        <button class="submenu-item" data-screen="dealer" data-title="Sales - Dealer visits">
          <span class="dot"></span>Dealer visits
        </button>
      </div>
    </div>
  </div>

  <div class="screens">

        title="Stock report"
      ></iframe>
    </div>

    <div class="screen" id="screen-dealer">
      <div class="loading" id="loading-dealer">
        <div class="spinner"></div>
        <span>Loading dealer visit report…</span>
      </div>
      <iframe
        src="https://script.google.com/macros/s/AKfycbyjNeQoTgdSV77Bv-CCWsnekRNSDO6j6bg3FXUD-cKBj7DYh0DO0Qspub7_AZFTPYzJ/exec"
        onload="document.getElementById('loading-dealer').style.display='none'"
        title="Dealer visit report"
      ></iframe>
    </div>

  </div>

</div>

<script>
  function updateClock() {
    const now = new Date();
    const dayStr = now.toLocaleDateString(undefined, { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('clock-day').textContent = dayStr;
    document.getElementById('clock-time').textContent = timeStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  const menuToggle = document.getElementById('menu-toggle');
  const menuOverlay = document.getElementById('menu-overlay');
  const parents = document.querySelectorAll('.menu-parent');
  const topLevelItems = document.querySelectorAll('.menu-item');
  const subItems = document.querySelectorAll('.submenu-item');
  const screens = document.querySelectorAll('.screen');

  menuToggle.addEventListener('click', () => {
    menuOverlay.classList.add('open');
  });

  menuOverlay.addEventListener('click', (e) => {
    if (e.target === menuOverlay) menuOverlay.classList.remove('open');
  });

  parents.forEach(parent => {
    parent.addEventListener('click', () => {
      const key = parent.getAttribute('data-parent');
      const submenu = document.querySelector('.submenu[data-submenu="' + key + '"]');
      const isOpen = parent.classList.contains('open');

      parents.forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.submenu').forEach(s => s.classList.remove('open'));

      if (!isOpen) {
        parent.classList.add('open');
        submenu.classList.add('open');
      }
    });
  });

  function goToScreen(target, title) {
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + target).classList.add('active');

    topLevelItems.forEach(i => i.classList.remove('active'));
    subItems.forEach(i => i.classList.remove('active'));
    const matchingTop = document.querySelector('.menu-item[data-screen="' + target + '"]');
    const matchingSub = document.querySelector('.submenu-item[data-screen="' + target + '"]');
    if (matchingTop) matchingTop.classList.add('active');
    if (matchingSub) matchingSub.classList.add('active');

    menuOverlay.classList.remove('open');
  }

  topLevelItems.forEach(item => {
    item.addEventListener('click', () => {
      goToScreen(item.getAttribute('data-screen'), item.getAttribute('data-title'));
    });
  });

  subItems.forEach(item => {
    item.addEventListener('click', () => {
      goToScreen(item.getAttribute('data-screen'), item.getAttribute('data-title'));
    });
  });
</script>
</body>
</html>
